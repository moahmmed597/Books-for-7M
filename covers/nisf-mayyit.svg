<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0505"/>
      <stop offset="50%" stop-color="#1c0707"/>
      <stop offset="100%" stop-color="#050202"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#glow)"/>
  <rect x="25" y="25" width="550" height="850" rx="10" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.6"/>
  <rect x="35" y="35" width="530" height="830" rx="8" fill="none" stroke="#991b1b" stroke-width="1" opacity="0.4"/>
  
  <text x="300" y="150" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="20" fill="#f87171" font-weight="600" text-anchor="middle" letter-spacing="4">أدب الرعب والتشويق العربي</text>
  
  <text x="300" y="380" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="48" fill="#ffffff" font-weight="bold" text-anchor="middle">نصف ميت</text>
  <text x="300" y="450" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="46" fill="#ef4444" font-weight="bold" text-anchor="middle">دُفن حيًا</text>
  
  <line x1="200" y1="500" x2="400" y2="500" stroke="#ef4444" stroke-width="2" opacity="0.8"/>
  <text x="300" y="550" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="22" fill="#fca5a5" text-anchor="middle">رواية صوتية كاملة</text>
  
  <text x="300" y="660" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="30" fill="#ffffff" font-weight="bold" text-anchor="middle">حسن الجندي</text>
  <text x="300" y="700" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="18" fill="#9ca3af" text-anchor="middle">رائد الرعب العربي الحديث</text>
  
  <text x="300" y="820" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="16" fill="#ef4444" text-anchor="middle" letter-spacing="2">7M ARABIC AUDIO LIBRARY</text>
</svg>
