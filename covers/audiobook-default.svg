<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#glow)"/>
  <rect x="25" y="25" width="550" height="850" rx="14" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.6"/>
  
  <!-- Headphones icon -->
  <circle cx="300" cy="300" r="100" fill="none" stroke="#818cf8" stroke-width="12"/>
  <rect x="180" y="260" width="40" height="80" rx="16" fill="#818cf8"/>
  <rect x="380" y="260" width="40" height="80" rx="16" fill="#818cf8"/>
  
  <text x="300" y="460" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" fill="#ffffff" font-weight="bold" text-anchor="middle">LIBRIVOX</text>
  <text x="300" y="505" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#a5b4fc" font-weight="600" text-anchor="middle" letter-spacing="4">CLASSIC AUDIOBOOK</text>
  
  <line x1="200" y1="550" x2="400" y2="550" stroke="#6366f1" stroke-width="2" opacity="0.8"/>
  
  <text x="300" y="610" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#e2e8f0" text-anchor="middle">World Literature &amp; Masterpieces</text>
  <text x="300" y="650" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">Public Domain Audio Recording</text>
  
  <text x="300" y="820" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#818cf8" text-anchor="middle" letter-spacing="3">7M SMART TV AUDIOBOOKS</text>
